geocoding:
  enabled: true
  endpoint: https://www.cartociudad.es/geocoder/api/geocoder/candidatesJsonp
  callback_parameter: callback
  batch_size: 250
  delay_seconds: 0.2
  timeout_seconds: 30
  fallback:
    enabled: true
    endpoint: https://nominatim.openstreetmap.org/search
    user_agent: desfibrilator-aed-accessibility/0.1 (research project)
    batch_size: 250
    delay_seconds: 1.0
    timeout_seconds: 30
  mapbox:
    enabled: false
    endpoint: https://api.mapbox.com/search/geocode/v6/batch
    batch_size: 100
    timeout_seconds: 60
    permanent: true
    proximity_radius_km: 35

llm_geocoding:
  enabled: false
  batch_size: 10
  prompt_version: address-hypotheses-v1
  mapbox_proximity_radius_km: 35
