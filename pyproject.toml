[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "desfibrilator"
version = "0.1.0"
description = "Urban network science analysis of AED accessibility in Castilla y Leon."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Roger" }]
dependencies = [
    "duckdb>=1.1",
    "geopandas>=1.0",
    "pandas>=2.2",
    "pandana>=0.8",
    "pyrosm>=0.13.1",
    "httpx>=0.27",
    "matplotlib>=3.11.1",
    "pyproj>=3.7.2",
    "pyyaml>=6.0",
    "tqdm>=4.70.0",
    "tobler>=0.13,<0.14",
    "pydantic-ai-slim[openai]>=2.42.0",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/desfibrilator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
